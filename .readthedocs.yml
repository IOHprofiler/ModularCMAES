# Read the Docs: the MkDocs site of mkdocs.yml. The API reference is read from the type stubs, so
# the extension is not built here.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
