# Read the Docs: the Zensical site of zensical.toml. The API reference is read from the type stubs,
# so the extension is not built here.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  commands:
    - python -m pip install -r docs/requirements.txt
    - zensical build --strict
    - mkdir -p $READTHEDOCS_OUTPUT/html
    - cp -r site/. $READTHEDOCS_OUTPUT/html/
