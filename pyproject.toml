[build-system]
# nanobind is pinned: its version shapes the extension and the generated stubs
requires = ["scikit-build-core>=1.1", "nanobind==3.1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "modcma"
version = "2.0.0"
description = "A fast, modular CMA-ES in C++ for Python: many evolution strategies in one optimizer, with ask-tell"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jacob de Nobel", email = "jacobdenobel@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["configspace", "numpy>=2.0", "scipy"]
keywords = [
    "CMA-ES",
    "evolution strategies",
    "evolutionary computation",
    "black-box optimization",
    "derivative-free optimization",
    "continuous optimization",
    "algorithm configuration",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/IOHprofiler/ModularCMAES"
Documentation = "https://modularcmaes.readthedocs.io"
Repository = "https://github.com/IOHprofiler/ModularCMAES"
Issues = "https://github.com/IOHprofiler/ModularCMAES/issues"
Changelog = "https://github.com/IOHprofiler/ModularCMAES/blob/master/CHANGELOG.md"

[tool.scikit-build]
minimum-version = "build-system.requires"
# FindPython's Development.Module (CMakeLists.txt); for a CMake older than 3.26 scikit-build-core
# brings the FindPython that has Development.SABIModule (the abi3 wheel)
cmake.version = ">=3.18"
# kept between builds: a rebuild (pip install --no-build-isolation -e .) compiles only what changed
build-dir = "build/{wheel_tag}"
wheel.packages = ["modcma"]
# one wheel for CPython 3.12 and later on the stable ABI (CMakeLists.txt: STABLE_ABI); 3.10 and
# 3.11 get a wheel of their own
wheel.py-api = "cp312"
sdist.exclude = [
    "scripts/",
    "docs/",
    "bench/",
    "build/",
    ".github/",
    "external/unsupported/Eigen/CXX11/",
    "banner.png",
    "*.so",
]

[tool.cibuildwheel]
# CPython 3.10 and 3.11 get their own wheels; the cp312 abi3 wheel serves 3.12 and later; the
# free-threaded 3.14t interpreter cannot use abi3 wheels and gets its own
build = ["cp310-*", "cp311-*", "cp312-*", "cp314t-*"]
# no 32-bit and no musl wheels; numpy has no Windows ARM64 wheels for 3.10
skip = ["*-win32", "*_i686", "*-musllinux*", "cp310-win_arm64"]
# the C++-version tests, including the golden trajectories (skipped without a fixture for the
# wheel's toolchain), from a copy of tests/ outside the source tree
test-sources = ["tests"]
test-command = "python -m unittest discover -s tests -t . -p \"test_c_*.py\""

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }
