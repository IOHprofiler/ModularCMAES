name: Unittest

on: [push]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install coverage
    - name: Install
      run: python -m pip install -e . -v
    - name: Test with coverage
      shell: bash
      run: |
        # The tests of the pure-Python implementation (no longer maintained) fail on Python 3.14
        # for reasons unrelated to the C++ version; there only the C++ version is tested.
        if [ "${{ matrix.python-version }}" = "3.14" ]; then
          coverage run -m unittest discover -p "test_c_*.py"
        else
          coverage run -m unittest discover
        fi
        coverage report -m modcma/[a-z]*.py
    - name: Golden fixture for this runner's toolchain
      if: ${{ always() && matrix.python-version == '3.12' }}
      shell: bash
      run: |
        name=$(python -c 'from tests import golden; print(golden.platform_name())')
        echo "$name"
        python -m tests.golden write --fixture "golden-$name.json"
    - name: Upload the golden fixture (commit it to tests/data/golden/ to check this toolchain in CI)
      if: ${{ always() && matrix.python-version == '3.12' }}
      uses: actions/upload-artifact@v4
      with:
        name: golden-fixture-${{ matrix.os }}
        path: golden-*.json
    - name: Upload coverage report
      if: ${{ matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest' }}
      env:
        CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
      run: |
        coverage xml -o cobertura.xml
        bash <(curl -Ls https://coverage.codacy.com/get.sh) report

  cpp:
    # The C++ targets: library, main, benchmark harness and the C++ unit tests (ctest)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --parallel 4
    - name: Test
      run: ctest --test-dir build --output-on-failure
    - name: Benchmark (smoke test)
      run: ./build/modcma_bench --dims 2,10 --generations 200 --repetitions 1
