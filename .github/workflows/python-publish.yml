name: Wheels

# Builds the wheels (configuration: [tool.cibuildwheel] in pyproject.toml) and the sdist; a
# published release uploads them to PyPI.
# Paused for the duration of the 2.0 development (#154): pull requests and pushes to master do not
# build the wheels; only a release and a run by hand do. Run it by hand before the release:
#   gh workflow run python-publish.yml --ref <branch>
# The release (#93) enables the triggers below again: pull requests (without macOS: its runners
# queue for a long time, macOS is checked locally) and pushes to master that touch the build.
on:
  release:
    types: [published]
  workflow_dispatch:
  # pull_request:
  #   paths:
  #     - "bindings/**"
  #     - "include/**"
  #     - "src/**"
  #     - "CMakeLists.txt"
  #     - "pyproject.toml"
  #     - ".github/workflows/python-publish.yml"
  # push:
  #   branches: [master]
  #   paths:
  #     - "bindings/**"
  #     - "include/**"
  #     - "src/**"
  #     - "CMakeLists.txt"
  #     - "pyproject.toml"
  #     - ".github/workflows/python-publish.yml"

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04", "ubuntu-24.04-arm", "windows-2022", "windows-11-arm"]' || '["ubuntu-24.04", "ubuntu-24.04-arm", "windows-2022", "windows-11-arm", "macos-15-intel", "macos-15"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v4.3.3
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_pypi:
    if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
